[package]
name = "momentum"
version = "0.1.0"
edition = "2024"

[dependencies]
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
# Only the features the code names. Several obvious-looking entries are implied
# by another one and are dead weight to list: Devices_Bluetooth comes from
# Devices_Bluetooth_Rfcomm, Foundation from Foundation_Collections,
# Win32_Media_Audio from ..._Endpoints, Win32_System_Com from
# ..._StructuredStorage. Win32_System_Variant looks unrelated but is required:
# IMMDevice::Activate is compiled only with Variant *and* StructuredStorage on.
# Foundation is named on its own despite Foundation_Collections being on: the
# collection feature does not compile Foundation's own items, and the event handler
# a listener subscribes with is one of them.
windows = { version = "0.62", features = [
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Devices",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
] }
# The completion state of a WinRT async call lives in windows-future, not in the
# `windows` crate's Foundation module, even though it is the `windows` crate that
# returns those types — so naming `AsyncStatus` needs the direct dependency.
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"
